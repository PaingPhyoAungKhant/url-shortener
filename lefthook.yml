pre-commit:
  commands:
    fmt:
      glob: "**/*.go"
      run: golangci-lint fmt {staged_files}
      stage_fixed: true

    lint:
      glob: "**/*.go"
      run: golangci-lint run ./...

pre-push:
  commands:
    test:
      glob: "**/*.go"
      run: go test ./...

    build:
      run: make build
